[project]
name = "ar09-llm-length"
version = "0.1.0"
description = "Track B case AR-09: LLM response length prediction on CASTILLO"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["case/tests", "case/dataset/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
